{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "surf-companion.fullname" . }}-backend
  labels:
    {{- include "surf-companion.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "surf-companion.backendSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller may reach the backend.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: {{ .Values.backend.port }}
  egress:
    # DNS
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Backing services (label the target namespaces accordingly)
    - to:
        - namespaceSelector:
            matchLabels: { surf.io/tier: data }
    - to:
        - namespaceSelector:
            matchLabels: { surf.io/tier: identity }
    - to:
        - namespaceSelector:
            matchLabels: { surf.io/tier: observability }
{{- end }}
