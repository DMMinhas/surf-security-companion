name: helm-lint

on:
  push:
    paths: ['deploy/helm/**']
  pull_request:
    paths: ['deploy/helm/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.2 }
      - name: helm lint
        run: helm lint deploy/helm/surf-companion
      - name: helm template (render smoke test)
        run: helm template surf-companion deploy/helm/surf-companion -f deploy/helm/surf-companion/values.yaml > /dev/null
      - name: kubeconform (schema-validate rendered manifests)
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          helm template surf-companion deploy/helm/surf-companion | ./kubeconform -strict -ignore-missing-schemas -summary
