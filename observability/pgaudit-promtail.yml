# Ships pgaudit JSON logs from the Postgres log volume into Loki AND tags
# them so the backend's OpenSearch ingest job (seed/production shipper) can
# also consume them. In production this collector is replaced by the
# platform log pipeline; the contract is the label set below.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pgaudit
    static_configs:
      - targets: [localhost]
        labels:
          job: pgaudit
          service: postgres
          __path__: /pglogs/*.json
    pipeline_stages:
      - json:
          expressions:
            message: message
            error_severity: error_severity
      - match:
          selector: '{job="pgaudit"} |~ "AUDIT:"'
          stages:
            - labels:
                audit: 'true'
