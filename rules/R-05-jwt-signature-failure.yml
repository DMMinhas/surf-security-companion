title: JWT signature validation failure spike
id: 9f3c5e71-8a04-4d26-bc98-15d7e2ab0f05
status: stable
description: >
  Detects more than 20 JWT signature validation failures at the API gateway
  within 5 minutes. A low background rate is normal (expired tokens); a spike
  indicates token forgery attempts, a key-rotation fault, or replay of tokens
  signed with a revoked key.
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1078/004/
tags:
  - attack.initial_access
  - attack.t1078.004
  - surf.threat.AV-05
  - nis2.art.21.2.b
level: high
logsource:
  product: api-gateway
  service: access
detection:
  selection:
    event.action: jwt_verification
    event.outcome: failure
    error.type: signature_invalid
  timeframe: 5m
  condition: selection | count() by source.ip > 20
falsepositives:
  - Keycloak key rotation without gateway JWKS cache refresh (fires once, self-heals)
owner: detection-team@surf
surf.threat_id: AV-05
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.5"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.24"
