title: Impossible-travel login for VNB user
id: 5d9e2c44-1b7f-4a63-8e02-93f5c7ab0f02
status: stable
description: >
  Detects two successful logins for the same VNB user from source IPs whose
  geo-resolved locations are more than 500 km apart within 30 minutes.
  The geo enrichment is performed at ingest; this rule matches the enriched
  flag. Indicates session hijacking or credential theft (valid accounts).
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.initial_access
  - attack.t1078
  - surf.threat.AV-02
  - nis2.art.21.2.b
level: high
logsource:
  product: keycloak
  service: events
detection:
  selection:
    event.action: LOGIN
    event.outcome: success
    surf.enrichment.impossible_travel: true
  condition: selection
falsepositives:
  - VPN egress switching between datacentre regions mid-session
  - Mobile carriers with NATed geo-inaccurate IP ranges
owner: detection-team@surf
surf.threat_id: AV-02
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.7"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.15"
