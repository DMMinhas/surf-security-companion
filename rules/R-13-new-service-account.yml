title: New service account outside change window
id: c7a2e514-8d0b-4f36-b9a7-42f1c6bf0f13
status: stable
description: >
  Detects creation of a Keycloak service account (client with service-account
  enabled) outside the declared change window (weekdays 08:00–18:00 Europe/Berlin,
  enriched at ingest as surf.enrichment.in_change_window). Off-hours service
  account creation is a common persistence step after admin credential theft.
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1136/003/
tags:
  - attack.persistence
  - attack.t1136.003
  - surf.threat.AV-07
  - nis2.art.21.2.b
level: medium
logsource:
  product: keycloak
  service: admin-events
detection:
  selection:
    event.action: CREATE
    keycloak.resource_type: CLIENT
    keycloak.service_account_enabled: true
  filter_change_window:
    surf.enrichment.in_change_window: true
  condition: selection and not filter_change_window
falsepositives:
  - Emergency break-glass automation deployments (must be logged as emergency changes)
owner: detection-team@surf
surf.threat_id: AV-07
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.3"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.2"
