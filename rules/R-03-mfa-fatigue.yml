title: Successful login after MFA prompt bombing
id: 7a1f0d38-6c2e-49b5-b1d4-40e8a9cd0f03
status: stable
description: >
  Detects a successful login that was preceded by 5 or more rejected or
  timed-out MFA challenges for the same user within 15 minutes. Classic
  MFA-fatigue (prompt bombing): the attacker holds valid credentials and
  spams push/OTP prompts until the user approves one.
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1621/
tags:
  - attack.credential_access
  - attack.t1621
  - surf.threat.AV-03
  - nis2.art.21.2.b
level: critical
logsource:
  product: keycloak
  service: events
detection:
  mfa_rejected:
    event.action: LOGIN_ERROR
    keycloak.error:
      - invalid_authentication
      - expired_code
    keycloak.credential_type:
      - otp
      - webauthn
  login_success:
    event.action: LOGIN
    event.outcome: success
  timeframe: 15m
  condition: (mfa_rejected | count() by user.name >= 5) and login_success
falsepositives:
  - Users fumbling a new authenticator during enrolment week
owner: detection-team@surf
surf.threat_id: AV-03
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.7"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.5"
