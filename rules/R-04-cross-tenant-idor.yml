title: Cross-tenant query
id: 1e6b8f52-3d9a-4c07-a8b5-72c0d1ef0f04
status: stable
description: >
  Detects a database query, logged by pgaudit, whose session tenant context
  (application_name carries the JWT surf_tenant_id) differs from the tenant_id
  literal or bind parameter in the statement. Indicates an IDOR / broken
  tenant-scope bug or an active cross-tenant data-access attempt. Any hit is
  a potential reportable event — see runbook RB-07.
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1213/
  - https://www.pgaudit.org/
tags:
  - attack.collection
  - attack.t1213
  - surf.threat.AV-04
  - nis2.art.21.2.h
level: critical
logsource:
  product: postgres
  service: pgaudit
detection:
  selection:
    event.action: query
    surf.enrichment.cross_tenant_mismatch: true
  filter_platform_roles:
    user.roles|contains:
      - PLATFORM_ADMIN
      - AUDITOR
  condition: selection and not filter_platform_roles
falsepositives:
  - Scheduled cross-tenant maintenance jobs running under a mislabelled service account
owner: detection-team@surf
surf.threat_id: AV-04
surf.compliance:
  - "NIS2 Art. 21(2)(h)"
  - "IEC 62443-3-3 FR5.1"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.3"
