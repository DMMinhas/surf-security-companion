title: Privileged role grant in Keycloak admin
id: b3f6d982-1a4c-4e57-90b3-7c5e8daf0f12
status: stable
description: >
  Detects assignment of a privileged realm role (PLATFORM_ADMIN, SOC_ANALYST,
  realm-management roles) to any user or service account via the Keycloak
  admin API. Every privileged grant must trace to an approved change; an
  unexpected grant indicates account manipulation for persistence.
author: SURF Detection Team
date: 2026/07/14
references:
  - https://attack.mitre.org/techniques/T1098/003/
tags:
  - attack.persistence
  - attack.t1098.003
  - surf.threat.AV-06
  - nis2.art.21.2.b
level: high
logsource:
  product: keycloak
  service: admin-events
detection:
  selection:
    event.action: UPDATE
    keycloak.resource_type: REALM_ROLE_MAPPING
    keycloak.operation: CREATE
    keycloak.role_name:
      - PLATFORM_ADMIN
      - SOC_ANALYST
      - realm-admin
      - manage-users
      - manage-realm
  condition: selection
falsepositives:
  - Onboarding of new SOC staff via the documented joiner process (correlate with change ticket)
owner: detection-team@surf
surf.threat_id: AV-06
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.3"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.2"
